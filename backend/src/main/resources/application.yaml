spring:
  application:
    name: health-wallet

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/healthwallet}
    username: ${SPRING_DATASOURCE_USERNAME:healthwallet}
    password: ${SPRING_DATASOURCE_PASSWORD:healthwallet123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

logging:
  level:
    com.healthwallet: DEBUG
    org.springframework.security: DEBUG